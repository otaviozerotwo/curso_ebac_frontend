<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galeria Imagens</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="../build/styles/main.css">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
  <script src="../build/scripts/modalTrigger.js" defer></script>
</head>
<body>
  <header class="p-3">
    <nav class="navbar">
      <div class="container px-3">
        <h1 class="mb-0">Galeria de Imagens</h1>
        <ul class="nav nav-underline">
          <li class="nav-item">
            <a href="#otherImages" class="nav-link fw-bold">Imagens</a>
          </li>
        </ul>
      </div>
    </nav>
  </header>
  <section class="section-carousel d-flex align-items-center">
    <div class="container">
      <div id="carousel" class="carousel slide" data-bs-ride="carousel">
        <div class="carousel-indicators">
          <button type="button" data-bs-target="#carousel" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
          <button type="button" data-bs-target="#carousel" data-bs-slide-to="1" aria-current="true" aria-label="Slide 2"></button>
          <button type="button" data-bs-target="#carousel" data-bs-slide-to="2" aria-current="true" aria-label="Slide 3"></button>
        </div>
        <div class="carousel-inner">
          <div class="carousel-item active">
            <img src="./images/bird-ga5d9ed257_1920.jpg" alt="Foto coruja voando" class="d-block w-100">
          </div>
          <div class="carousel-item">
            <img src="./images/birds-g6b63afc7a_1920.jpg" alt="Foto patos na água" class="d-block w-100">
          </div>
          <div class="carousel-item">
            <img src="./images/butterfly-g7f3546b64_1920.jpg" alt="Foto borboleta pousada" class="d-block w-100">
          </div>
        </div>
  
        <button class="carousel-control-prev" type="button" data-bs-target="#carousel" data-bs-slide="prev">
          <span class="carousel-control-prev-icon" aria-hidden="true"></span>
          <span class="visually-hidden">Previous</span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#carousel" data-bs-slide="next">
          <span class="carousel-control-next-icon" aria-hidden="true"></span>
          <span class="visually-hidden">Next</span>
        </button>
      </div>
    </div>
  </section>

  <section class="section-other-images py-4" id="otherImages">
    <div class="container">
      <h2 class="py-4 text-center">Clique na imagem para ampliá-la</h2>
      <div class="row justify-content-between">
        <div class="col-md-3 img-container">
          <img src="./images/hands-gc143a78ba_1920.png" class="d-block w-100 rounded border border-white" data-bs-toggle="modal" data-bs-target="#modal" alt="">
        </div>
        <div class="col-md-3">
          <img src="./images/lilies-g19bcb21a4_1920.jpg" class="d-block w-100 rounded border border-white" data-bs-toggle="modal" data-bs-target="#modal" alt="">
        </div>
        <div class="col-md-3">
          <img src="./images/street-gddeece843_1920.jpg" class="d-block w-100 rounded border border-white" data-bs-toggle="modal" data-bs-target="#modal" alt="">
        </div>
      </div>
    </div>

    <div class="modal fade" id="modal" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-labelledby="modalLabel" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-body text-center">
            <img src="" alt="" id="modalImage" class="img-fluid">
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" aria-label="Close">Fechar</button>
          </div>
        </div>
      </div>
    </div>
  </section>

  <footer class="p-4">
    <div class="container border-top text-center">
      <p class="pt-4">&copy 2025 - Otávio Cardoso. Todos os direitos reservados.</p>
    </div>
  </footer>
</body>
</html>
