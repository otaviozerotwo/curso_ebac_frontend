<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic Tac Toe Special</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="@@PATH_CSS">
</head>
<body>
  <h1>Tic Tac Toe Special</h1>

  <div class="container">
    <div class="controls">
      <div class="symbol">
        <label for="symbol">Chose your symbol: </label>
        <label>
          <input type="radio" name="symbol" value="X" checked>
          X
        </label>
        <label>
          <input type="radio" name="symbol" value="O">
          O
        </label>
      </div>
  
      <div class="algorithm">
        <label for="algorithm">Chose the algorithm: </label>
        <label>
          <input type="radio" name="algorithm" value="minimax" checked>
          Minimax
        </label>
        <label>
          <input type="radio" name="algorithm" value="alphabeta">
          Alpha-Beta
        </label>
      </div>
      
      <div class="level">
        <label for="depth">Difficulty Level (1-3):</label>
        <input type="number" id="depth" value="3" min="1" max="3">
      </div>
      
      <div class="btn-replay-container">
        <button id="btn-replay" class="btn-replay">Replay</button>
      </div>
  
    </div>

    <div class="board-container">
      <table id="board" class="board"></table>
    </div>

    <div class="placar"></div>
  
    <div id="end-game-container" class="modal-end-game"></div>
  </div>

  <script src="@@PATH_JS_INPUT_VALIDATION"></script>
  <script src="@@PATH_JS_RENDER_BOARD"></script>
  <script src="@@PATH_JS_MINIMAX"></script>
  <script src="@@PATH_JS_ALPHABETA"></script>
  <script src="@@PATH_JS_TIC_TAC_TOE"></script>
</body>
</html>
