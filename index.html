<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu GitHub</title>
  <link rel="stylesheet" href="main.css">
</head>
<body>
  <header>
    <div class="container">
      <img id="avatar" class="profile-avatar" src="https://placehold.co/180x180" alt=".">
      <h1 id="name" class="profile-name"></h1>
      <h2 id="username" class="profile-username"></h2>
      <ul class="numbers">
        <li class="numbers-item">
          <h4>Repositórios</h4>
          <span id="repos"></span>
        </li>
        <li class="numbers-item">
          <h4>Seguidores</h4>
          <span id="followers"></span>
        </li>
        <li class="numbers-item">
          <h4>Seguindo</h4>
          <span id="following"></span>
        </li>
      </ul>
      <a href="#" id="link" class="profile-link">Ver no GitHub</a>
    </div>
  </header>
  <script src="main.js"></script>
</body>
</html>
